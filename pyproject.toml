[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smhi2epw"
version = "1.1.0"
description = "Compile SMHI actual-year EPW weather with assessed donors and same-year ERA5 recovery."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "smhi2epw contributors" }]
keywords = ["smhi", "epw", "energyplus", "weather", "amy", "strang", "metobs"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5.3",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.0",
    "ruff>=0.9",
    "twine>=5.0",
    "types-requests>=2.28",
]
test = ["pytest>=7.0"]
docs = [
    "nbsphinx>=0.9",
    "nbsphinx-link>=1.3",
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
]
tutorials = [
    "ipykernel>=6.25",
    "ipython>=8.12",
    "jupyterlab>=4.0",
    "matplotlib>=3.7",
    "nbclient>=0.9",
    "nbformat>=5.9",
]

[project.scripts]
smhi2epw = "smhi2epw.cli:main"

[project.urls]
Homepage = "https://github.com/SB-Chalmers/smhi2epw"
Repository = "https://github.com/SB-Chalmers/smhi2epw.git"
Issues = "https://github.com/SB-Chalmers/smhi2epw/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smhi2epw = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require live SMHI or Open-Meteo endpoints",
    "energyplus: deterministic integration tests requiring the pinned EnergyPlus engine",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
