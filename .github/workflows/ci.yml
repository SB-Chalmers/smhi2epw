name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Static checks
        run: |
          ruff check src tests examples docs
          ruff format --check src tests examples docs
          mypy src/smhi2epw
      - name: Offline tests
        run: pytest -q -m "not network and not energyplus"

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.24.0" "pandas==1.5.3" "requests==2.28.0" "pvlib==0.16.1" "pytest>=8"
          python -m pip install --no-deps -e .
          pytest -q -m "not network and not energyplus"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/*
          if-no-files-found: error

  wheel:
    needs: package
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist
      - name: Install built wheel
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install "${wheels[0]}[test,tutorials]"
      - name: Verify wheel import and run offline tests outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import smhi2epw
          origin = Path(smhi2epw.__file__).resolve()
          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert not origin.is_relative_to(checkout), origin
          assert "site-packages" in origin.parts, origin
          print(smhi2epw.__version__, origin)
          PY
          python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -q -m "not network and not energyplus"

  energyplus:
    needs: package
    runs-on: ubuntu-24.04
    env:
      SMHI2EPW_EXAMPLES_DIR: ${{ github.workspace }}/examples
      PYTHONPATH: ${{ github.workspace }}/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/energyplus-24.2.0-94a887817b
          key: energyplus-ubuntu24.04-x86_64-24.2.0-94a887817b-af523c74226659c2
      - name: Install and require the pinned study engine
        run: bash scripts/install_energyplus.sh "$RUNNER_TEMP/energyplus-24.2.0-94a887817b"
      - name: Install the built wheel and notebook kernel
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install "${wheels[0]}[test,tutorials]"
          python -m ipykernel install --user --name smhi2epw-wheel-ci
          mkdir -p "$RUNNER_TEMP/energyplus-validation"
          {
            printf 'SMHI2EPW_EPW_PATH=%s/energyplus-validation/notebook.epw\n' "$RUNNER_TEMP"
            printf 'SMHI2EPW_NOTEBOOK_EPW_PATH=%s/energyplus-validation/notebook.epw\n' "$RUNNER_TEMP"
            printf 'SMHI2EPW_VALIDATION_DIR=%s/energyplus-validation\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Run deterministic provider-to-engine tests against the wheel
        working-directory: ${{ runner.temp }}/energyplus-validation
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import smhi2epw
          origin = Path(smhi2epw.__file__).resolve()
          assert not origin.is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]).resolve()), origin
          assert "site-packages" in origin.parts, origin
          assert Path(os.environ["ENERGYPLUS_EXE"]).is_file()
          print(smhi2epw.__version__, origin)
          PY
          python -m pytest "$GITHUB_WORKSPACE/tests/test_energyplus.py" --import-mode=importlib -q -m energyplus --basetemp "$RUNNER_TEMP/energyplus-validation/tests"
          test -s "$SMHI2EPW_EPW_PATH"
      - name: Execute the EnergyPlus application notebook without provider requests
        working-directory: ${{ runner.temp }}/energyplus-validation
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          notebook_path = Path(os.environ["SMHI2EPW_EXAMPLES_DIR"]) / "09_run_energyplus.ipynb"
          notebook = nbformat.read(notebook_path, as_version=4)
          NotebookClient(notebook, timeout=900, kernel_name="smhi2epw-wheel-ci",
                         resources={"metadata": {"path": str(Path.cwd())}}).execute()
          nbformat.write(notebook, "09_run_energyplus.executed.ipynb")
          PY
      - name: Preserve engine and notebook diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energyplus-validation
          path: ${{ runner.temp }}/energyplus-validation
          if-no-files-found: warn

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation and tutorial tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,tutorials]"
      - name: Validate docstrings and notebooks
        run: |
          pytest -q tests/test_documentation.py -m "not energyplus"
          pytest -q --doctest-modules src/smhi2epw
      - name: Build documentation
        run: |
          sphinx-build -W --keep-going -b html docs docs/_build/html
          sphinx-build -W --keep-going -b doctest docs docs/_build/doctest

  release-gate:
    if: always()
    needs: [test, minimum-dependencies, package, wheel, documentation, energyplus]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job to succeed
        env:
          VALIDATION_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ["VALIDATION_RESULTS"])
          failed = {name: job["result"] for name, job in results.items()
                    if job["result"] != "success"}
          assert not failed, failed
          PY

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-gate
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist
      - name: Publish the validated distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist
      - name: Require the tag to match distribution metadata
        run: |
          python - <<'PY'
          import email
          import os
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              assert len(names) == 1, names
              metadata = email.message_from_bytes(archive.read(names[0]))
          assert os.environ["GITHUB_REF_NAME"] == "v" + metadata["Version"], metadata["Version"]
          PY
      - name: Create the GitHub release with the validated distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  network:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test,tutorials]"
      - run: pytest -q -m network
      - name: Exercise the live getting-started notebook
        run: jupyter execute --timeout=900 examples/00_getting_started.ipynb
