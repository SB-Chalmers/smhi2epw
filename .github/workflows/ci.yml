name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Static checks
        run: |
          ruff check src tests examples docs
          ruff format --check src tests examples docs
          mypy src/smhi2epw
      - name: Offline tests
        run: pytest -q -m "not network"

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.24.0" "pandas==1.5.3" "requests==2.28.0" "pytest>=8"
          python -m pip install --no-deps -e .
          pytest -q -m "not network"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation and tutorial tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,tutorials]"
      - name: Validate docstrings and notebooks
        run: |
          pytest -q tests/test_documentation.py
          pytest -q --doctest-modules src/smhi2epw
      - name: Build documentation
        run: |
          sphinx-build -W --keep-going -b html docs docs/_build/html
          sphinx-build -W --keep-going -b doctest docs docs/_build/doctest

  network:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test,tutorials]"
      - run: pytest -q -m network
      - name: Exercise the live getting-started notebook
        run: jupyter execute --timeout=900 examples/00_getting_started.ipynb
